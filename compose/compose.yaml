name: mycrew
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: postgres@sha256:e31e3d5327d1806f6177827c9710643e4f35f7ab3f14d26d05332753d3e95ee0
    restart: unless-stopped
    environment:
      POSTGRES_USER: mycrew
      POSTGRES_DB: mycrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.py}
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - ledger:/var/lib/postgresql/data
      - ../config/ledger.sql:/docker-entrypoint-initdb.d/01-ledger.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mycrew -d mycrew']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    pids_limit: 256
    logging: *logging
  litellm:
    image: ghcr.io/berriai/litellm@sha256:5e1c40a4f91cb13ae5161b30d09a9874a64d2556283ae766e86ec1edddb9af3e
    restart: unless-stopped
    network_mode: host
    command: [--config, /app/mycrew.yaml, --host, 127.0.0.1, --port, '4000']
    environment:
      DATABASE_URL: postgresql://mycrew:${POSTGRES_PASSWORD}@127.0.0.1:5433/mycrew
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: 'False'
    volumes: ['../config/litellm.yaml:/app/mycrew.yaml:ro']
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging: *logging
  hermes:
    image: nousresearch/hermes-agent@sha256:d566d4a435767265c2a0172030b778fbdaa1a9ab19442c75ec5aad1df32dec54
    restart: unless-stopped
    network_mode: host
    command: [gateway, run]
    environment:
      HERMES_UID: ${HERMES_UID}
      HERMES_GID: ${HERMES_GID}
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: '9119'
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_PORT: '8642'
      API_SERVER_KEY: ${HERMES_API_KEY}
    volumes:
      - ../state/hermes:/opt/data
      - ../config/hermes.yaml:/opt/data/config.yaml:ro
      - ../config/SOUL.md:/opt/data/SOUL.md:ro
      - ../workspace:/workspace
    mem_limit: 3g
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  ledger:
    external: true
    name: mycrew_ledger
